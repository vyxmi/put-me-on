<!--
  Supabase → Authentication → Email Templates → Change Email Address
  (this is what fires when a guest saves their history — updateUser({ email }) on an anonymous session)

  Variables available: {{ .Token }} {{ .ConfirmationURL }} {{ .SiteURL }} {{ .Email }} {{ .NewEmail }}
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>confirm it's you</title>
<style>
  body, table, td { margin:0; padding:0; }
  body { background:#f5f3ef; font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; }
  .bg { background:#f5f3ef; }
  .card { background:#ffffff; border:1px solid #e6e3dc; }
  .wordmark { color:#726f7c; }
  .heading { color:#0a0a0d; }
  .body-text { color:#4a4850; }
  .code { color:#0a0a0d; background:#f5f3ef; border:1px solid #e6e3dc; }
  .muted { color:#aba8b4; }
  .btn { background:#0a0a0d; color:#f5f3ef !important; }
  .divider { border-top:1px solid #e6e3dc; }

  @media (prefers-color-scheme: dark) {
    .bg { background:#0a0a0d !important; }
    .card { background:#131316 !important; border-color:rgba(245,243,239,0.1) !important; }
    .wordmark { color:#aba8b4 !important; }
    .heading { color:#f5f3ef !important; }
    .body-text { color:#dad8e0 !important; }
    .code { color:#f5f3ef !important; background:#0a0a0d !important; border-color:rgba(245,243,239,0.14) !important; }
    .muted { color:#726f7c !important; }
    .btn { background:#a6a0f0 !important; color:#0a0a0d !important; }
    .divider { border-color:rgba(245,243,239,0.08) !important; }
  }
</style>
</head>
<body class="bg">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="bg">
  <tr>
    <td align="center" style="padding:48px 20px;">
      <table role="presentation" width="440" cellpadding="0" cellspacing="0" class="card" style="border-radius:2px; max-width:440px; width:100%;">
        <tr>
          <td style="padding:36px 36px 8px;">
            <div class="wordmark" style="font-weight:700; font-size:13px; letter-spacing:0.02em;">put me on</div>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 36px 0;">
            <div class="heading" style="font-size:22px; font-weight:600; letter-spacing:-0.01em; line-height:1.3;">
              saved :-)
            </div>
            <div class="body-text" style="margin-top:10px; font-size:15px; line-height:1.55;">
              confirm {{ .NewEmail }} and this becomes your account — same history, nothing lost.
            </div>
          </td>
        </tr>
        <tr>
          <td style="padding:28px 36px 0;">
            <div class="code" style="border-radius:2px; padding:20px; text-align:center; font-family:'Courier New', Courier, monospace; font-size:32px; font-weight:700; letter-spacing:0.28em;">
              {{ .Token }}
            </div>
          </td>
        </tr>
        <tr>
          <td style="padding:28px 36px 0;" class="divider"></td>
        </tr>
        <tr>
          <td style="padding:20px 36px 0;">
            <div class="muted" style="font-size:13px; line-height:1.6;">
              or confirm directly on this device:
            </div>
          </td>
        </tr>
        <tr>
          <td style="padding:14px 36px 0;">
            <a href="{{ .ConfirmationURL }}" class="btn" style="display:inline-block; border-radius:2px; padding:12px 22px; font-size:14px; font-weight:600; text-decoration:none;">
              confirm →
            </a>
          </td>
        </tr>
        <tr>
          <td style="padding:32px 36px 36px;">
            <div class="muted" style="font-size:12px; line-height:1.6;">
              if you didn't request this, you can ignore this email — your account won't change.
            </div>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
